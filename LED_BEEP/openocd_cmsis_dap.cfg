# ------------------------------------------------------------------
#  LED_BEEP  /  STM32F429IGTx  /  ALIENTEK Apollo V2 baseboard
#  Debug probe : ALIENTEK DAP emulator (CMSIS-DAP, VID 04D8 PID 00DF)
#
#  Verified working command line:
#    openocd -s <st_scripts> \
#            -f interface/cmsis-dap.cfg -f target/stm32f4x.cfg
#  Result:
#    Info : CMSIS-DAP: Interface ready
#    Info : SWD DPIDR 0x2ba01477
#    Info : [stm32f4x.cpu] Cortex-M4 r0p1 processor detected
#    Info : device id = 0x20036419   (0x419 = STM32F42x/43x)
#    Info : flash size = 1024 KiB
#
#  This file is the equivalent, as a single standalone OpenOCD script.
#  Use it in CubeIDE via:
#    Debug Configurations -> Debugger -> OpenOCD Setup
#      -> Configuration Script -> User Defined
#      -> Script File: <this file>
# ------------------------------------------------------------------

# --- 1. adapter driver: CMSIS-DAP (NOT stlink!) ---
adapter driver cmsis-dap

# Optional: pin the exact unit if several CMSIS-DAP probes are attached.
# cmsis_dap_serial ATK_20210914

# --- 2. transport: SWD only (JTAG is not wired / not needed) ---
transport select swd

# --- 3. clock: 4 MHz, proven stable with this probe ---
adapter speed 4000

# --- 4. reset ---
# srst (nRESET) is carried by the 20-pin JTAG ribbon.
# If you only wired SWDIO / SWCLK / GND / 3V3, comment this line out.
reset_config srst_only srst_nogate

# --- 5. target ---
source [find target/stm32f4x.cfg]
